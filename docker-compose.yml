version: '3' # Docker Compose 버전

services:
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  springboot:
    image: 767397934477.dkr.ecr.ap-northeast-2.amazonaws.com/petlog:latest
    container_name: petlog-server
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy